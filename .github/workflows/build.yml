name: Build and Release CIHUYNIME Mobile

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Catatan Rilis / What’s New (Opsional)'
        required: false
        default: 'Peningkatan performa dan perbaikan bug.'
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Publish Mobile APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        repository: 'ZertCihuyy/CIHUYNIME-APK'
        token: ${{ secrets.MY_PAT }}
        ref: 'main'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Ganti task ini jika pakai Product Flavor (misal: ./gradlew assembleMobileRelease)
    - name: Build Mobile APK
      run: ./gradlew assembleDebug

    - name: Rename APK Output
      run: |
        mkdir -p release-apk
        cp app/build/outputs/apk/debug/*.apk release-apk/CIHUYNIME-v${{ github.run_number }}.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CIHUYNIME-Mobile-APK
        path: release-apk/*.apk
        retention-days: 7

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: release-apk/*.apk
        tag_name: mobile ${{ github.run_number }}
        name: "CIHUYNIME ${{ github.run_number }}"
        body: |
          ### 🚀 What's New / Catatan Rilis:
          ${{ github.event.inputs.release_notes || 'Peningkatan performa dan perbaikan bug.' }}

          ---
          *Official Android Release Build*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
