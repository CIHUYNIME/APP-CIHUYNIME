Name: Build and Release CIHUYNIME Mobile

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Catatan Rilis / What’s New (Opsional)'
        required: false
        default: 'Peningkatan performa dan perbaikan bug.'
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Publish Mobile APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        repository: 'ZertCihuyy/CIHUYNIME-APK'
        token: ${{ secrets.MY_PAT }}
        ref: 'main'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Extract App Version
      id: get_version
      run: |
        # Mengambil versionName dari build.gradle / build.gradle.kts
        VERSION=$(grep -E 'versionName' app/build.gradle* | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
        
        # Fallback jika gagal membaca file gradle
        if [ -z "$VERSION" ]; then
          VERSION="2.4"
        fi

        echo "VERSI=$VERSION" >> $GITHUB_ENV
        echo "Versi terdeteksi: $VERSION"

    - name: Build Mobile APK
      run: ./gradlew assembleDebug

    - name: Rename APK Output
      run: |
        mkdir -p release-apk
        # Menghasilkan output persis cihuynime-v{versi}.apk
        cp app/build/outputs/apk/debug/*.apk release-apk/cihuynime-v${{ env.VERSI }}.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cihuynime-v${{ env.VERSI }}
        path: release-apk/cihuynime-v${{ env.VERSI }}.apk
        retention-days: 7

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: release-apk/cihuynime-v${{ env.VERSI }}.apk
        tag_name: "v${{ env.VERSI }}"
        name: "CIHUYNIME v${{ env.VERSI }}"
        body: |
          ### 🚀 What's New / Catatan Rilis:
          ${{ github.event.inputs.release_notes || 'Peningkatan performa dan perbaikan bug.' }}

          ---
          *Official Android Release Build*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
